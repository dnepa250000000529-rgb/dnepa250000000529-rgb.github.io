<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown to HTML Converter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: #24292e;
            color: #ffffff;
            padding: 1rem 2rem;
            text-align: center;
        }

        .container {
            display: flex;
            flex: 1;
            gap: 1rem;
            padding: 1rem;
            overflow: hidden;
        }

        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .pane-header {
            background-color: #e1e4e8;
            padding: 0.5rem 1rem;
            font-weight: bold;
            font-size: 0.9rem;
            border-bottom: 1px solid #d1d5da;
        }

        textarea {
            flex: 1;
            padding: 1rem;
            border: none;
            resize: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            outline: none;
            line-height: 1.5;
        }

        .preview {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            line-height: 1.6;
        }

        /* Generated HTML Styling */
        .preview h1, .preview h2, .preview h3, .preview h4, .preview h5, .preview h6 {
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid #eaecef;
            padding-bottom: 0.3em;
        }

        .preview p {
            margin-bottom: 1rem;
        }

        .preview blockquote {
            padding: 0 1em;
            color: #6a737d;
            border-left: 0.25em solid #dfe2e5;
            margin-bottom: 1rem;
        }

        .preview code {
            padding: 0.2em 0.4em;
            background-color: rgba(27,31,35,0.05);
            border-radius: 3px;
            font-family: SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace;
            font-size: 85%;
        }

        .preview ul, .preview ol {
            padding-left: 2em;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Markdown to HTML Converter</h1>
    </header>

    <div class="container">
        <!-- Input Pane -->
        <div class="pane">
            <div class="pane-header">Markdown Input</div>
            <textarea id="markdown-input" placeholder="Type your Markdown here..."></textarea>
        </div>

        <!-- Output Pane -->
        <div class="pane">
            <div class="pane-header">HTML Live Preview</div>
            <div id="html-preview" class="preview"></div>
        </div>
    </div>

    <script>
        function convertMarkdownToHTML(markdown) {
            let html = markdown;

            // Headers (# H1, ## H2, etc.)
            html = html.replace(/^###### (.*$)/gim, '<h6>$1</h6>');
            html = html.replace(/^##### (.*$)/gim, '<h5>$1</h5>');
            html = html.replace(/^#### (.*$)/gim, '<h4>$1</h4>');
            html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');

            // Bold (**text** or __text__)
            html = html.replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>');
            html = html.replace(/__(.*?)__/gim, '<strong>$1</strong>');

            // Italic (*text* or _text_)
            html = html.replace(/\*(.*?)\*/gim, '<em>$1</em>');
            html = html.replace(/_(.*?)_/gim, '<em>$1</em>');

            // Blockquotes (> text)
            html = html.replace(/^\> (.*$)/gim, '<blockquote>$1</blockquote>');

            // Inline Code (`code`)
            html = html.replace(/`(.*?)`/gim, '<code>$1</code>');

            // Unordered Lists (- item or * item)
            html = html.replace(/^\s*[\-\*]\s+(.*)$/gim, '<ul><li>$1</li></ul>');
            // Clean up adjacent <ul> tags
            html = html.replace(/<\/ul>\s*<ul>/gim, '');

            // Paragraphs (lines separated by double newlines)
            html = html.replace(/\n$/gm, '');
            html = html.replace(/\n\n+/g, '</p><p>');
            
            return `<p>${html}</p>`.replace(/<p><\/p>/g, '');
        }

        const inputArea = document.getElementById('markdown-input');
        const previewArea = document.getElementById('html-preview');

        // Initial default text
        inputArea.value = `# Welcome to Markdown Converter\n\nThis is a **live** preview tool.\n\n### Features:\n* Convert **bold** and *italic* text\n* Support headers and blockquotes\n* Instant live rendering\n\n> "Simplicity is prerequisite for reliability." - Edsger W. Dijkstra`;
        
        // Render default text on load
        previewArea.innerHTML = convertMarkdownToHTML(inputArea.value);

        // Update preview on input
        inputArea.addEventListener('input', () => {
            previewArea.innerHTML = convertMarkdownToHTML(inputArea.value);
        });
    </script>
</body>
</html>
